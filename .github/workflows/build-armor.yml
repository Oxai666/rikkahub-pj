name: build-armor-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout upstream 3.1.1
        uses: actions/checkout@v4
        with:
          repository: rikkahub/rikkahub
          ref: 3.1.1

      - name: Fetch armor payload from this fork
        run: |
          set -e
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/armor-ci.tar.gz"
          echo "fetch $URL"
          curl -fsSL --retry 3 --retry-delay 3 -o /tmp/armor-ci.tar.gz "$URL"
          ls -l /tmp/armor-ci.tar.gz
          tar tzf /tmp/armor-ci.tar.gz

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 预装了 Android SDK，但 cmdline-tools 不在 PATH 里；
      # 找不到就自己下 commandlinetools，保证 sdkmanager 一定存在。
      - name: Install Android SDK components
        run: |
          set -euo pipefail

          SDKM=""
          SDK_ROOT=""
          for root in /usr/local/lib/android/sdk /opt/android-sdk "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}"; do
            [ -n "$root" ] || continue
            if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKM="$root/cmdline-tools/latest/bin/sdkmanager"
              SDK_ROOT="$root"
              break
            fi
          done

          if [ -z "$SDKM" ]; then
            echo "no sdkmanager on runner, downloading commandlinetools..."
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL --retry 3 -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKM=$SDKM"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          # yes 会被 SIGPIPE，pipefail 下返回 141，必须吞掉
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

          "$SDKM" "platforms;android-37"

          BT=$("$SDKM" --list 2>/dev/null | grep -oE "build-tools;3[7-9][0-9]*\.[0-9.]+" | sed 's/build-tools;//' | sort -V | tail -1 || true)
          if [ -z "$BT" ]; then
            BT=$("$SDKM" --list 2>/dev/null | grep -oE "build-tools;3[0-9]\.[0-9.]+" | sed 's/build-tools;//' | sort -V | tail -1 || true)
          fi
          echo "build-tools => $BT"
          "$SDKM" "build-tools;$BT"

          "$SDKM" "cmake;3.22.1"

          NDK=$("$SDKM" --list 2>/dev/null | grep -oE "ndk;[0-9.]+" | sed 's/ndk;//' | sort -V | tail -1 || true)
          echo "ndk => $NDK"
          "$SDKM" "ndk;$NDK"
          echo "android.ndkVersion=$NDK" >> gradle.properties

      - name: Apply armor patch
        run: |
          set -e
          mkdir -p app/src/main/java/me/rerere/rikkahub/data/ai/armor
          tar xzf /tmp/armor-ci.tar.gz -C app/src/main/java/me/rerere/rikkahub/data/ai/armor
          python3 app/src/main/java/me/rerere/rikkahub/data/ai/armor/patch.py
          rm -f app/src/main/java/me/rerere/rikkahub/data/ai/armor/patch.py
          echo "--- 确认改动落位 ---"
          grep -n "ArmorTransformer" app/src/main/java/me/rerere/rikkahub/data/ai/ChatRequestFactory.kt
          grep -n "ArmorProvider" app/src/main/java/me/rerere/rikkahub/service/ChatService.kt

      - name: Build debug APK
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-armor-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
