name: build-armor-apk

# 改动说明（相对旧版）：
#   1. 上游版本改成可输入参数 upstream_ref，默认仍是 3.1.1 —— 升级只填个 tag，不用改文件
#   2. armor 包不再走 raw.githubusercontent，改成 checkout 本仓库取 —— 私有仓库也能用，
#      且取的是「触发这次构建的那个 commit」的包，不会和分支 tip 错位
#   3. Release 发布改成可选开关，默认关闭 —— 安装包编完下载到本地，不留在 GitHub 上
#   4. 加 gradle 缓存、上游 commit 记录、armor 包 sha256 记录
#   5. 锁 ubuntu-24.04（避开 ubuntu-latest 迁 Ubuntu 26），action 升到 node24 版消警告
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 rikkahub/rikkahub 的 tag / 分支 / commit'
        required: false
        default: '3.1.1'
        type: string
      publish_release:
        description: '编完是否挂到 Release（默认 false：包只下载到本地，不留在 GitHub）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: armor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref || '3.1.1' }}

    steps:
      # ---- 先取自己的 armor 包（私有仓库可用，不依赖 raw CDN）----
      - name: Checkout armor payload (this repo)
        uses: actions/checkout@v5
        with:
          path: armor-src

      - name: Stage armor payload
        run: |
          set -e
          cp armor-src/armor-ci.tar.gz /tmp/armor-ci.tar.gz
          ls -lh /tmp/armor-ci.tar.gz
          sha256sum /tmp/armor-ci.tar.gz | tee /tmp/armor.sha256

      # ---- 上游源码（版本由 upstream_ref 决定）----
      - name: Checkout upstream
        uses: actions/checkout@v5
        with:
          repository: rikkahub/rikkahub
          ref: ${{ inputs.upstream_ref || '3.1.1' }}
          path: .
          clean: false
          submodules: recursive

      - name: Record upstream revision
        run: |
          set -e
          COMMIT="$(git rev-parse HEAD)"
          echo "UPSTREAM_COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "上游 ref: $UPSTREAM_REF"
          echo "上游 commit: $COMMIT"
          git log -1 --format='%h %ad %s' --date=short

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install SDK packages
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          fi
          echo "SDK=$SDK"
          echo "SDKM=$SDKM"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

          "$SDKM" "platforms;android-37.2"
          "$SDKM" "build-tools;37.0.0"
          "$SDKM" "cmake;3.22.1"
          "$SDKM" "ndk;29.0.14206865"
          "$SDKM" --channel=3 "platforms;android-37" || true
          echo "--- platforms ---"
          ls "$SDK/platforms" || true
          echo "--- ndk ---"
          ls "$SDK/ndk" || true

      - name: Prepare gradle properties
        run: |
          set -e
          echo "android.ndkVersion=29.0.14206865" >> gradle.properties
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/platforms/android-37" ]; then
            echo "android-37 缺失，library 模块 compileSdk 降到 36"
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true
            sed -i 's/compileSdk = 37/compileSdk = 36/' \
              build-logic/src/main/kotlin/AndroidLibraryConventionPlugin.kt
          fi
          grep -n "compileSdk" build-logic/src/main/kotlin/AndroidLibraryConventionPlugin.kt || true

      - name: Stub google-services.json
        run: |
          set -e
          mkdir -p app/src/github
          echo '{"project_info":{"project_number":"123456789000","project_id":"rikkahub-local","storage_bucket":"rikkahub-local.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789000:android:0123456789abcdef","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"[REDACTED]"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789000:android:0123456789abcdee","android_client_info":{"package_name":"me.rerere.rikkahub.debug"}},"oauth_client":[],"api_key":[{"current_key":"[REDACTED]"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          cp app/google-services.json app/src/github/google-services.json
          ls -l app/google-services.json app/src/github/google-services.json

      - name: Apply armor patch
        run: |
          set -e
          rm -rf /tmp/armor-src && mkdir -p /tmp/armor-src
          tar xzf /tmp/armor-ci.tar.gz -C /tmp/armor-src

          MAIN_DIR=app/src/main/java/me/rerere/rikkahub/data/ai/armor
          TEST_DIR=app/src/test/java/me/rerere/rikkahub/data/ai/armor
          mkdir -p "$MAIN_DIR" "$TEST_DIR"

          cp /tmp/armor-src/ArmorState.kt /tmp/armor-src/ArmorJudge.kt /tmp/armor-src/ArmorProvider.kt /tmp/armor-src/ArmorTransformer.kt "$MAIN_DIR/"
          cp /tmp/armor-src/patch.py .
          if ls /tmp/armor-src/*Test.kt >/dev/null 2>&1; then
            cp /tmp/armor-src/*Test.kt "$TEST_DIR/"
          else
            echo "（包内无测试文件）"
          fi

          python3 patch.py
          rm -f patch.py

          echo "--- 确认改动落位 ---"
          grep -n "ArmorTransformer" app/src/main/java/me/rerere/rikkahub/data/ai/ChatRequestFactory.kt
          grep -n "ArmorProvider" app/src/main/java/me/rerere/rikkahub/service/ChatService.kt
          echo "--- 测试文件 ---"
          ls -l "$TEST_DIR" || true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: |
          set -e
          pnpm --version
          node --version
          pnpm install --frozen-lockfile

      # 先跑单测：判定逻辑错了的话，APK 打出来也是废的，早红早改
      - name: Unit tests (armor)
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:testGithubDebugUnitTest \
            --tests "me.rerere.rikkahub.data.ai.armor.*" \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: armor-test-report
          path: app/build/reports/tests/testGithubDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode summary

      # ---- 产物改名：带上游版本 + 时间戳，下载下来能分清是哪一个 ----
      - name: Package APK
        id: pkg
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d-%H%M)"
          OUT="rikkahub-armor-${UPSTREAM_REF}-${STAMP}"
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/github/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::没有找到 APK"
            exit 1
          fi
          for f in "${apks[@]}"; do
            cp "$f" "dist/${OUT}-$(basename "$f")"
          done
          ls -lh dist/
          {
            echo "stamp=${STAMP}"
            echo "out=${OUT}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: rikkahub-armor-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ---- 挂 Release：永久保存，不过期 ----
      - name: Publish release
        if: success() && inputs.publish_release != false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: armor-${{ steps.pkg.outputs.stamp }}
          TITLE: ${{ steps.pkg.outputs.out }}
        run: |
          set -euo pipefail
          {
            echo "**upstream**: \`${UPSTREAM_REF}\` (\`${UPSTREAM_COMMIT}\`)"
            echo ""
            echo "**armor payload**: \`$(cat /tmp/armor.sha256)\`"
            echo ""
            echo "**triggering commit**: \`${GITHUB_SHA}\`"
            echo ""
            echo "APK 为 debug 签名，自用。"
          } > /tmp/notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，覆盖附件"
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "$TITLE" \
              --prerelease \
              --notes-file /tmp/notes.md
          fi
          echo "已发布: $TAG"
