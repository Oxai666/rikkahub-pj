name: build-armor-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout upstream 3.1.1
        uses: actions/checkout@v5
        with:
          repository: rikkahub/rikkahub
          ref: 3.1.1

      - name: Fetch armor payload from this fork
        run: |
          set -e
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/armor-ci.tar.gz"
          echo "fetch $URL"
          curl -fsSL --retry 3 --retry-delay 3 -o /tmp/armor-ci.tar.gz "$URL"
          ls -l /tmp/armor-ci.tar.gz

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      # app 模块：compileSdk { version = release(37) { minorApiLevel = 2 } } → platforms;android-37.2
      # library 模块：compileSdk = 37 → 需要 platforms;android-37（canary，得用 --channel=3）
      - name: Install SDK packages
        run: |
          set -x
          sdkmanager "platforms;android-37.2"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;29.0.14206865"
          sdkmanager --channel=3 "platforms;android-37" || true
          echo "--- platforms 目录 ---"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      # canary 平台装不上时，把 library 模块的 compileSdk 降到 36，保证能编
      - name: Fallback for library compileSdk
        run: |
          set -e
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "android-37 不可用，library 模块降到 36"
            sdkmanager "platforms;android-36"
            sed -i 's/compileSdk = 37/compileSdk = 36/' \
              build-logic/src/main/kotlin/AndroidLibraryConventionPlugin.kt
            grep -n "compileSdk" build-logic/src/main/kotlin/AndroidLibraryConventionPlugin.kt
          else
            echo "android-37 已就位"
          fi
          echo "android.ndkVersion=29.0.14206865" >> gradle.properties

      - name: Apply armor patch
        run: |
          set -e
          mkdir -p app/src/main/java/me/rerere/rikkahub/data/ai/armor
          tar xzf /tmp/armor-ci.tar.gz -C app/src/main/java/me/rerere/rikkahub/data/ai/armor
          python3 app/src/main/java/me/rerere/rikkahub/data/ai/armor/patch.py
          rm -f app/src/main/java/me/rerere/rikkahub/data/ai/armor/patch.py
          echo "--- 确认改动落位 ---"
          grep -n "ArmorTransformer" app/src/main/java/me/rerere/rikkahub/data/ai/ChatRequestFactory.kt
          grep -n "ArmorProvider" app/src/main/java/me/rerere/rikkahub/service/ChatService.kt

      - name: Build debug APK
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-armor-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
