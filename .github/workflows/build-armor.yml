name: build-armor-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout upstream 3.1.1
        uses: actions/checkout@v5
        with:
          repository: rikkahub/rikkahub
          ref: 3.1.1

      - name: Fetch armor payload from this fork
        run: |
          set -e
          URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/armor-ci.tar.gz"
          curl -fsSL --retry 3 --retry-delay 3 -o /tmp/armor-ci.tar.gz "$URL"
          ls -l /tmp/armor-ci.tar.gz

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：它内部会 sdkmanager tools，而 tools 包已下架。
      # 直接用 runner 预装的 cmdline-tools。
      # app 模块要 platforms;android-37.2（compileSdk 37 + minorApiLevel 2）
      # library 模块要 platforms;android-37（canary，需 --channel=3）
      - name: Install SDK packages
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          fi
          echo "SDK=$SDK"
          echo "SDKM=$SDKM"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

          "$SDKM" "platforms;android-37.2"
          "$SDKM" "build-tools;37.0.0"
          "$SDKM" "cmake;3.22.1"
          "$SDKM" "ndk;29.0.14206865"
          "$SDKM" --channel=3 "platforms;android-37" || true
          echo "--- platforms ---"
          ls "$SDK/platforms" || true
          echo "--- ndk ---"
          ls "$SDK/ndk" || true

      - name: Prepare gradle properties
        run: |
          set -e
          echo "android.ndkVersion=29.0.14206865" >> gradle.properties
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/platforms/android-37" ]; then
            echo "android-37 缺失，library 模块 compileSdk 降到 36"
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true
            sed -i 's/compileSdk = 37/compileSdk = 36/' \
              build-logic/src/main/kotlin/AndroidLibraryConventionPlugin.kt
          fi
          grep -n "compileSdk" build-logic/src/main/kotlin/AndroidLibraryConventionPlugin.kt || true

      # 上游仓库不含 google-services.json（属于作者私有 Firebase 配置），
      # 用一个最小占位让 google-services 插件能生成资源；运行期 analytics 静默失败，不影响主功能。
      - name: Stub google-services.json
        run: |
          set -e
          mkdir -p app/src/github
          echo '{"project_info":{"project_number":"123456789000","project_id":"rikkahub-local","storage_bucket":"rikkahub-local.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789000:android:0123456789abcdef","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForLocalBuild000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789000:android:0123456789abcdee","android_client_info":{"package_name":"me.rerere.rikkahub.debug"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForLocalBuild000000000001"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          cp app/google-services.json app/src/github/google-services.json
          ls -l app/google-services.json app/src/github/google-services.json

      - name: Apply armor patch
        run: |
          set -e
          mkdir -p app/src/main/java/me/rerere/rikkahub/data/ai/armor
          tar xzf /tmp/armor-ci.tar.gz -C app/src/main/java/me/rerere/rikkahub/data/ai/armor
          python3 app/src/main/java/me/rerere/rikkahub/data/ai/armor/patch.py
          rm -f app/src/main/java/me/rerere/rikkahub/data/ai/armor/patch.py
          echo "--- 确认改动落位 ---"
          grep -n "ArmorTransformer" app/src/main/java/me/rerere/rikkahub/data/ai/ChatRequestFactory.kt
          grep -n "ArmorProvider" app/src/main/java/me/rerere/rikkahub/service/ChatService.kt

      - name: Build debug APK
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode summary

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-armor-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
